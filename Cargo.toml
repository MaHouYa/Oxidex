[workspace]
members = [
    "crates/kerything",
    "crates/kerything-core",
    "crates/kerything-scanner-helper",
]
resolver = "3"

[workspace.package]
version = "1.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Reikooters <https://github.com/Reikooters>"]
repository = "https://github.com/Reikooters/kerything"

[workspace.dependencies]
anyhow = "1.0"
byteorder = "1.5"
crossbeam-channel = "0.5"
eframe = "0.34.3"
egui_extras = "0.34.3"
ext4 = "0.9.0"
ntfs = "0.4.0"
open = "5.3"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
xdg = "3.0"

[patch.crates-io]
ext4 = { path = "vendor/ext4" }
