[workspace]
members = [
    "crates/kerything",
    "crates/kerything-cli",
    "crates/kerything-client",
    "crates/kerything-core",
    "crates/kerything-daemon",
    "crates/kerything-scanner-helper",
    "crates/kerything-scannerd",
]
resolver = "3"

[workspace.package]
version = "1.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Reikooters <https://github.com/Reikooters>"]
repository = "https://github.com/Reikooters/kerything"

[workspace.dependencies]
anyhow = "1.0"
byteorder = "1.5"
crossbeam-channel = "0.5"
btrfs-fs = "0.13.0"
eframe = { version = "0.34.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui_extras = "0.34.3"
ext4 = "0.9.0"
globset = "0.4"
libc = "0.2"
notify = "8"
ntfs = "0.4.0"
open = "5.3"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
toml = "0.9"
xdg = "3.0"

[patch.crates-io]
ext4 = { path = "vendor/ext4" }
